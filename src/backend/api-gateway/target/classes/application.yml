server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: student-service
          uri: http://localhost:8082
          predicates:
            - Path=/students/**
        - id: faculty-service
          uri: http://localhost:8083
          predicates:
            - Path=/faculty/**
        - id: academic-service
          uri: http://localhost:8084
          predicates:
            - Path=/academic/**
        - id: classroom-service
          uri: http://localhost:8085
          predicates:
            - Path=/classroom/**
        - id: attendance-service
          uri: http://localhost:8086
          predicates:
            - Path=/attendance/**
        - id: resource-service
          uri: http://localhost:8087
          predicates:
            - Path=/resources/**
        - id: transport-service
          uri: http://localhost:8088
          predicates:
            - Path=/transport/**
        - id: event-service
          uri: http://localhost:8089
          predicates:
            - Path=/event/**
        - id: infrastructure-service
          uri: http://localhost:8090
          predicates:
            - Path=/infrastructure/**
        - id: notification-service
          uri: http://localhost:8091
          predicates:
            - Path=/notification/**
        - id: dashboard-service
          uri: http://localhost:8092
          predicates:
            - Path=/dashboard/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
